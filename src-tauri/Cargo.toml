[package]
name = "productivity-tracker"
version = "0.1.0"
description = "Local-only Mac productivity and daily task tracker"
authors = ["you"]
edition = "2021"

[lib]
name = "productivity_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# strip=true breaks proc-macro dylibs on newer rustc (zerofrom_derive E0463)
strip = false
panic = "abort"
